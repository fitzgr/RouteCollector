name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/google-maps-overlay
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore desktop debug keystore
        if: github.event_name != 'pull_request'
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload Route Collector debug APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: routecollector-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Publish stable latest-debug release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk routecollector-debug.apk
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '{"versionCode":%s,"versionName":"0.1.%s","buildTime":"%s","apkUrl":"https://github.com/fitzgr/RouteCollector/releases/download/latest-debug/routecollector-debug.apk"}\n' "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "$BUILD_TIME" > update.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest-debug "$GITHUB_SHA"
          git push origin refs/tags/latest-debug --force

          if gh release view latest-debug >/dev/null 2>&1; then
            gh release upload latest-debug routecollector-debug.apk update.json --clobber
            gh release edit latest-debug \
              --title "Route Collector Latest Debug" \
              --notes "Latest cloud-built Route Collector debug APK. Branch: $GITHUB_REF_NAME. Commit: $GITHUB_SHA. For testing only."
          else
            gh release create latest-debug routecollector-debug.apk update.json \
              --title "Route Collector Latest Debug" \
              --notes "Latest cloud-built Route Collector debug APK. Branch: $GITHUB_REF_NAME. Commit: $GITHUB_SHA. For testing only." \
              --prerelease
          fi
